 if(cara==='feliz2'){x.strokeStyle=TINTA;x.lineWidth=5;[-1,1].forEach(d=>{x.beginPath();x.arc(d*22,-52,11,Math.PI*1.1,Math.PI*1.9);x.stroke()})}
 else [-1,1].forEach(d=>{const ex=d*22,ey=-56,rx=sur?16:13,ry=(sur?18:14)*pis;x.fillStyle='#fff';x.beginPath();x.ellipse(ex,ey,rx,ry,0,0,7);x.fill();x.lineWidth=3.5;x.strokeStyle=TINTA;x.stroke();

function quarto(t,o={}){
 // parede com luz quente

 // papel de parede (bolinhas)
 x.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<14;i++)for(let j=0;j<16;j++){x.beginPath();x.arc(i*80+(j%2)*40,j*80,6,0,7);x.fill()}

 // janela (céu muda com o dia)
 const ceu=o.ceu||'noite';const wx=640,wy=300,ww=330,wh=360;

  for(let k=0;k<14;k++){x.fillStyle=`rgba(255,255,255,${.5+.5*Math.sin(t*3+k)})`;x.fillRect(wx+hash(k)*ww,wy+hash(k+9)*wh*.7,4,4)}}
 else{x.fillStyle='rgba(255,255,255,.9)';[[80,120],[220,220]].forEach(([a,b],k)=>{const cx=wx+((a+t*12+k*90)%(ww+120))-60;x.beginPath();x.arc(cx,wy+b,26,0,7);x.arc(cx+30,wy+b-12,30,0,7);x.arc(cx+62,wy+b,24,0,7);x.fill()})}
 x.strokeStyle='#f4efe6';x.lineWidth=14;x.beginPath();x.moveTo(wx+ww/2,wy);x.lineTo(wx+ww/2,wy+wh);x.moveTo(wx,wy+wh/2);x.lineTo(wx+ww,wy+wh/2);x.stroke();

 // calendário
 calendario(o.dia??1,o.diaK??1,t);
 // pôster (foguete) quando ele decide virar astronauta
 if(o.poster){forma(()=>rr(380,330,190,250,8),'#1a2350',{sombra:false});x.fillStyle='#fff';for(let k=0;k<10;k++)x.fillRect(390+hash(k)*170,340+hash(k+3)*230,3,3);
  x.save();x.translate(475,470);x.rotate(.5);forma(()=>{x.moveTo(0,-80);x.quadraticCurveTo(30,-40,24,40);x.lineTo(-24,40);x.quadraticCurveTo(-30,-40,0,-80);x.closePath()},'#f2f2f4',{sombra:false,lw:4});
  forma(()=>x.arc(0,-20,11,0,7),'#5fb6ff',{sombra:false,lw:3});x.fillStyle='#ffb020';x.beginPath();x.moveTo(-16,42);x.lineTo(0,80+Math.sin(t*30)*8);x.lineTo(16,42);x.fill();x.restore()}

 // tapete
 x.fillStyle='#d9606a';x.beginPath();x.ellipse(470,1330,380,58,0,0,7);x.fill();x.strokeStyle='#ffd0a0';x.lineWidth=5;x.beginPath();x.ellipse(470,1330,330,40,0,0,7);x.stroke();

 if(!o.semTV){forma(()=>rr(820,820,230,170,12),'#2b2b3a',{sombra:false});forma(()=>rr(910,990,50,30,4),'#2b2b3a',{sombra:false});

 // abajur na parede (luz quente)
 forma(()=>{x.moveTo(110,560);x.lineTo(210,560);x.lineTo(236,640);x.lineTo(84,640);x.closePath()},'#ffd27a',{sombra:false,lw:4});x.fillStyle=TINTA;x.fillRect(154,520,12,40);
 cama(t,o);
