// Viral 05 — Como se faz um telhado. Estilo da skill `anatomy`: isométrico, papel claro, 4 tons + contorno,
// a camada do passo atual em tinta escura ("lit"), cartão Fig 1 com dica e leitura ao vivo. Tudo por código.
import * as THREE from 'three';
const W=1080,H=1920,$=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},

const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-100,200);
scene.add(new THREE.AmbientLight(0xffffff,.55));const sol=new THREE.DirectionalLight(0xffffff,.75);sol.position.set(-4,9,6);scene.add(sol);
const g4=new Uint8Array([120,175,215,250]);const grad=new THREE.DataTexture(g4,4,1,THREE.RedFormat);grad.needsUpdate=true;

 const add=m=>{g.add(m);return m};
 add(caixa(.14,.2,2*MEIO+.3,'mid',[x,Y0+.1,0]));                                   // linha (tirante)
 for(const s of [-1,1]){const m=vigaNaAgua(s,0,MEIO/Math.cos(ANG),x,.14,.2,-.1,'mid');add(m);
  const e=caixa(.1,.14,1.4,'mid',[x,Y0+ALT*.45,s*.75]);e.rotation.x=-s*.9;add(e)}   // pernas + escoras

// 2) terças (ao longo de x) a d = 0, 1.5, 3.0 em cada água (d=0 = cumeeira de madeira)
for(const s of [-1,1])for(const d of [0,1.5,3.0]){if(d===0&&s===1)continue;const p=naAgua(s,d,.05);CAM.terca.push(caixa(LX+.6,.16,.12,'mid',[0,p[1],p[0]]))}

const regua=new THREE.Group();scene.add(regua);{const a=naAgua(1,MEIO/Math.cos(ANG)*.25+.2,0);const x=LX/2+.5;

 barra(pts[0],pts[1]);barra(pts[1],pts[2]);barra(pts[2],pts[0]);for(const p of pts){const d=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),TONS.lit);d.position.set(...p);regua.add(d)}}

const B=TEMPO.beats;

B.forEach(b=>{const toks=b.fala.split(' ');const ws=b.words;let wi=0;const tt=toks.map(tk=>{const n=norm(tk);for(let j=wi;j<ws.length;j++){const m=norm(ws[j].w);if(m===n||(n&&m.startsWith(n))||(m&&n.startsWith(m))){wi=j+1;return ws[j]}}return null});
 const ch=[];let cur=[];toks.forEach((tk,i)=>{cur.push({tk,w:tt[i]});if(cur.length===3||/[.,?!:]$/.test(tk)||i===toks.length-1){ch.push(cur);cur=[]}});
 b.chunks=ch.map(c=>({t0:(c.find(x=>x.w)||{w:{t0:b.t0}}).w.t0,html:c.map(x=>CHAVE.has(norm(x.tk))?`<span class="k">${x.tk}</span>`:x.tk).join(' ')}))});

const MONTA={tesoura:[1,.15,.75],terca:[4,.15,.8],caibro:[6,.05,.95],ripa:[8,.05,.9],telhaCanal:[11,.05,.95],telhaCapa:[12,.25,.95],cumeeira:[15,.1,.8],prego:[14,.05,.9]};

const PASSOS=['','1 · tesoura','1 · tesoura','1 · tesoura','2 · terças','2 · terças','3 · caibros','3 · caibros','4 · ripas','4 · ripas','4 · ripas','5 · telhas','5 · telhas','5 · telhas','5 · telhas','5 · cumeeira','resumo','resumo'];
window.renderAt=(t)=>{
