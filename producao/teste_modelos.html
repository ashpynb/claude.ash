<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
// Teste: modelos CC0 (Quaternius/Kenney) + luz "dusk" medida em references/look.md do what-if-animation:
// céu roxo→laranja, sol baixo, luz quente de contorno (rim), neblina, sombras, meio-tons escuros.
import * as THREE from 'three';
import {GLTFLoader} from './vendor/jsm/loaders/GLTFLoader.js';
const W=1080,H=1920;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);
r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.05;r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x6a4a7a,14,46);
// céu em gradiente
const sky=new THREE.Mesh(new THREE.SphereGeometry(120,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},
 vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 p;void main(){float h=clamp(p.y*1.6+.15,0.,1.);vec3 a=vec3(1.,.55,.28),b=vec3(.42,.27,.55),c=vec3(.13,.1,.28);gl_FragColor=vec4(h<.5?mix(a,b,h*2.):mix(b,c,(h-.5)*2.),1.);}'}));
scene.add(sky);
const sol=new THREE.Mesh(new THREE.SphereGeometry(3,32,16),new THREE.MeshBasicMaterial({color:0xffd9a0,fog:false}));sol.position.set(-18,6,-60);scene.add(sol);
scene.add(new THREE.HemisphereLight(0x8a6fb0,0x2a1d2a,.55));
const key=new THREE.DirectionalLight(0xffb070,2.2);key.position.set(-10,6,-14);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:60});key.shadow.bias=-0.0005;scene.add(key);
const fill=new THREE.DirectionalLight(0x7f9bff,.35);fill.position.set(8,5,10);scene.add(fill);
const chao=new THREE.Mesh(new THREE.CircleGeometry(60,64).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:new THREE.Color(0x2f4a24).convertSRGBToLinear(),roughness:1}));chao.receiveShadow=true;scene.add(chao);
const cam=new THREE.PerspectiveCamera(40,W/H,.1,300);
const L=new GLTFLoader();const load=u=>new Promise((ok,err)=>L.load(u,g=>ok(g),undefined,err));
const sombra=o=>o.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});
let mixers=[];
async function main(){
 const [fox,moca,b1,t1,grama,flores]=await Promise.all(['Fox','character-female-b','BirchTree_1','CommonTree_1','Grass','Flowers'].map(n=>load('modelos/'+n+'.glb')));
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<14;i++){const tr=(i%2?b1:t1).scene.clone();tr.position.set((rnd()-.5)*30,0,-6-rnd()*22);tr.scale.setScalar(.9+rnd()*.8);tr.rotation.y=rnd()*6;sombra(tr);scene.add(tr)}
 for(let i=0;i<60;i++){const g=(i%3?grama:flores).scene.clone();g.position.set((rnd()-.5)*14,0,(rnd()-.5)*10);g.scale.setScalar(.22+rnd()*.18);g.rotation.y=rnd()*6;sombra(g);scene.add(g)}
 const F=fox.scene;F.scale.setScalar(.55);F.position.set(1.2,0,1.2);F.rotation.y=-1.0;sombra(F);scene.add(F);
 const mf=new THREE.AnimationMixer(F);mf.clipAction(fox.animations.find(a=>/Walk$/.test(a.name))).play();mixers.push([mf,F,'walk']);
 const M=moca.scene;M.scale.setScalar(1.6);M.position.set(-1.0,0,1.6);M.rotation.y=.7;sombra(M);scene.add(M);
 const mm=new THREE.AnimationMixer(M);mm.clipAction(moca.animations.find(a=>a.name==='emote-yes')).play();mixers.push([mm,M,'idle']);
 window.pronto=true;
}
const PLANOS=[ // [cam pos, alvo] — tamanhos diferentes (wide, medium, close, low angle), como em look.md
 [[0,2.6,11],[0,1.0,0]],[[3.2,1.0,5.6],[0.4,0.6,1.2]],[[-0.6,2.0,5.0],[-1,1.4,1.6]],[[1.6,.3,4.4],[0.4,1.0,1.2]]];
window.renderAt=(t)=>{const p=PLANOS[Math.floor(t)%PLANOS.length];
 for(const [m,o,k] of mixers){m.setTime(t*1.0);if(k==='walk'){o.position.x=1.2-((t*.8)%3)}}
 cam.position.set(...p[0]);cam.lookAt(...p[1]);r.render(scene,cam)};
window.TOTAL=4;main();
</script></body></html>
