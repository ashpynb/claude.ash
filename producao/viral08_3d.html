// ============ TERRENO (vale do rio, low-poly) ============
const DH=12;// altura da barragem
function curvaDesvio(s){// s 0..1 → [x,z] (canal pelo lado direito, contorna o canteiro)
 const z=lerp(-22,22,s);return [8+9*Math.sin(Math.PI*s),z]}
function curvaPira(s){const z=lerp(26,-26,s);return [-10-6*Math.sin(Math.PI*s)+Math.sin(s*40)*.8,z]}
const dSeg=(x,z,f,n=60)=>{let m=1e9;for(let i=0;i<=n;i++){const [a,b]=f(i/n);const d=Math.hypot(x-a,z-b);if(d<m)m=d}return m};

 if(kDesvio>0&&x>0){const d=dSeg(x,z,curvaDesvio);if(d<2.6){const c=ease(1-d/2.6);h=lerp(h,0,c*kDesvio)}}

 return h}
const NG=150,TG=new THREE.PlaneGeometry(100,100,NG,NG);TG.rotateX(-Math.PI/2);
const cores=new Float32Array(TG.attributes.position.count*3);TG.setAttribute('color',new THREE.BufferAttribute(cores,3));
const terreno=malha(TG,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,envMapIntensity:.15}));cena.add(terreno);

 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);const h=altura(x,z);p.setY(i,h);

// árvores low-poly

const trA=copias(new THREE.CylinderGeometry(.18,.22,1,5),flat('#7a5236'),arv.map(a=>[a[0],altura(a[0],a[2])+.5*a[4],a[2],0,a[4]]));cena.add(trA);

function fita(f,larg,y,n=80){const pos=[],idx=[];for(let i=0;i<=n;i++){const [x,z]=f(i/n);const [x2,z2]=f(Math.min(1,(i+1)/n));const [x0,z0]=f(Math.max(0,(i-1)/n));let dx=x2-x0,dz=z2-z0;const L=Math.hypot(dx,dz)||1;const nx=-dz/L,nz=dx/L;pos.push(x+nx*larg/2,y,z+nz*larg/2,x-nx*larg/2,y,z-nz*larg/2);if(i<n){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}

// tampas do corte (no plano x≈0, viradas pra +x): u=-z

const terraTex=tex(512,512,(g,w,h)=>{g.fillStyle='#8a4a2a';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(${hash(i)>.5?'50,20,8':'170,100,60'},${.25+hash(i+1)*.3})`;g.beginPath();g.arc(hash(i+2)*w,hash(i+3)*h,1+hash(i+4)*4,0,7);g.fill()}});terraTex.wrapS=terraTex.wrapT=THREE.RepeatWrapping;terraTex.repeat.set(.12,.12);
const rochaTex=tex(512,512,(g,w,h)=>{g.fillStyle='#6d6a72';g.fillRect(0,0,w,h);for(let i=0;i<60;i++){g.fillStyle=`rgba(${hash(i)>.5?'40,40,50':'150,150,160'},.4)`;g.beginPath();const x=hash(i+2)*w,y=hash(i+3)*h;g.moveTo(x,y);for(let k=0;k<5;k++)g.lineTo(x+(hash(i*9+k)-.5)*80,y+(hash(i*7+k)-.5)*60);g.fill()}});rochaTex.wrapS=rochaTex.wrapT=THREE.RepeatWrapping;rochaTex.repeat.set(.1,.1);
const capas=new THREE.Group();cena.add(capas);
capas.add(tampa(retU(-50,50,-3,0),new THREE.MeshStandardMaterial({map:terraTex,roughness:1})));

const capaAgua=tampa(retU(-50,-1,0,1),new THREE.MeshStandardMaterial({color:lin('#2f8fe0'),transparent:true,opacity:.75,roughness:.2}));capas.add(capaAgua);
// galerias (furos escuros na tampa da barragem)
const galerias=new THREE.Group();capas.add(galerias);[[1.5,1.2],[4.2,1.2],[1.2,5.2]].forEach(([z,y])=>{const g=new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.2),new THREE.MeshBasicMaterial({color:lin('#221e28')}));g.rotation.y=Math.PI/2;g.position.set(-.012,y+.6,z);g.renderOrder=3;galerias.add(g);const l=malha(G.esf(.12,8),new THREE.MeshBasicMaterial({color:lin('#ffd27a'),toneMapped:false}));l.position.set(-.005,y+1,z);l.scale.set(.1,1,1);galerias.add(l)});
const dreno=new THREE.Mesh(new THREE.PlaneGeometry(.25,3.4),new THREE.MeshBasicMaterial({color:lin('#221e28')}));dreno.rotation.y=Math.PI/2;dreno.position.set(-.012,3.6,1.5);dreno.renderOrder=3;galerias.add(dreno);
// régua de profundidade e setas de pressão
const setas=new THREE.Group();cena.add(setas);const mSeta=flat('#ff5a3c',{emis:'#ff3a1c',ei:.3});
for(let i=0;i<6;i++){const g=new THREE.Group();const c=malha(G.cil(.12,.12,1,8),mSeta);c.rotation.x=Math.PI/2;g.add(c);const p=malha(new THREE.ConeGeometry(.3,.6,8),mSeta);p.rotation.x=Math.PI/2;p.position.z=.75;g.add(p);g.position.set(-.3,DH-1-i*2,-1.6);setas.add(g)}
const regua=new THREE.Group();cena.add(regua);for(let i=0;i<=6;i++){const tk=malha(G.cx(.15,.06,i%1?0.5:1,.01),flat('#10314a'));tk.position.set(-.3,DH-i*2,-6);regua.add(tk)}const rg=malha(G.cx(.15,DH,.12,.02),flat('#10314a'));rg.position.set(-.3,DH/2,-6.5);regua.add(rg);
// gotas da subpressão
const gotas=[];for(let i=0;i<14;i++){const g=malha(G.esf(.22,10),flat('#5fb6ff',{emis:'#2f7fe0',ei:.3}));cena.add(g);gotas.push(g)}
// prédio de 65 andares
const predioTex=tex(128,512,(g,w,h)=>{g.fillStyle='#8aa0b8';g.fillRect(0,0,w,h);for(let y=4;y<h;y+=8)for(let x=6;x<w;x+=16){g.fillStyle=hash(x*7+y)>.3?'#cfe6ff':'#ffe08a';g.fillRect(x,y,10,5)}});
const predio=malha(G.cx(2.6,DH,2.6,.05),new THREE.MeshStandardMaterial({map:predioTex,roughness:.6}));predio.position.set(-3.5,DH/2,13);cena.add(predio);
// comportas + vertedouro (lado x<0, pra aparecer no corte)
const comps=[];for(let i=0;i<3;i++){const c=malha(G.cx(1.3,1.5,.5,.06),flat('#e8503c',{metal:.3,rough:.5}));c.position.set(-6.5+i*1.6,DH+.4,-.6);cena.add(c);comps.push(c)}
const espTex=tex(64,256,(g,w,h)=>{g.fillStyle='rgba(255,255,255,.0)';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${.5+hash(i)*.5})`;g.fillRect(hash(i+1)*w,hash(i+2)*h,4+hash(i+3)*10,20+hash(i+4)*40)}},[2,3]);
const LV=Math.hypot(9.3,DH-1.4),ang=Math.atan2(DH-1.4,9.3);
const cascata=new THREE.Mesh(new THREE.PlaneGeometry(4.6,LV),new THREE.MeshStandardMaterial({color:lin('#5fb0ff'),emissive:lin('#2f80e0'),emissiveIntensity:.25,map:espTex,transparent:true,opacity:.95,roughness:.2,side:THREE.DoubleSide}));
cascata.rotation.order='YXZ';cascata.rotation.x=-(Math.PI/2-ang);cascata.position.set(-4.9,(DH-1.4)/2+.15,(9+.3)/2-.05);cena.add(cascata);
// tubo do conduto forçado + casa de força + turbina
const curvaTubo=new THREE.CatmullRomCurve3([new THREE.Vector3(-3,7,-1.6),new THREE.Vector3(-3,6.4,.5),new THREE.Vector3(-3,3,5),new THREE.Vector3(-3,1.2,9),new THREE.Vector3(-3,1.1,10.5)]);
const tubo=malha(new THREE.TubeGeometry(curvaTubo,60,.55,16,false),new THREE.MeshStandardMaterial({color:lin('#4a5260'),metalness:.6,roughness:.35,side:THREE.DoubleSide}));cena.add(tubo);
const fluxo=[];for(let i=0;i<24;i++){const f=malha(G.esf(.22,8),flat('#7fd0ff',{emis:'#3fa0ff',ei:.5}),{sombra:false});cena.add(f);fluxo.push(f)}
const casa=new THREE.Group();casa.position.set(-3,0,11.8);cena.add(casa);casa.add(Object.assign(malha(G.cx(8,3.4,3.4,.1),flat('#e9dcc2')),{}));casa.children[0].position.y=1.7;
const telhaC=malha(G.cx(8.3,.3,3.7,.05),flat('#d9482b'));telhaC.position.y=3.5;casa.add(telhaC);

const bulbo=malha(G.esf(1.2,24),vidroM);lamp.add(bulbo);const rosca=malha(G.cil(.75,.75,1.1,16),flat('#9aa0ad',{metal:.6}));rosca.position.y=-1.9;lamp.add(rosca);const lampLuz=new THREE.PointLight(lin('#ffd25a'),0,30,1.5);lamp.add(lampLuz);

 const o=malha(G.esf(.06,6),flat('#1b1626'));o.position.set(.12,.08,.25);f.add(o);const o2=o.clone();o2.position.x=-.12;f.add(o2);cena.add(f);peixes.push(f)}
